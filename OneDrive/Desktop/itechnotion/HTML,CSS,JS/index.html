<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily AI News Digest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --dark-bg: #0a0e27;
            --card-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #b8c5d6;
            --text-muted: #8892b0;
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            --hover-shadow: 0 15px 35px rgba(31, 38, 135, 0.5);
            --border-radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            background-image:
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(120, 198, 255, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header Styles */
        header {
            backdrop-filter: blur(20px);
            background: rgba(10, 14, 39, 0.8);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.5rem 0;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
        }

        .header-content p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }

        .subscribe-btn {
            background: var(--secondary-gradient);
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subscribe-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--hover-shadow);
            filter: brightness(1.1);
        }

        /* Categories Styles */
        .categories-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .categories {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .category-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .category-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent-gradient);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .category-btn:hover::before,
        .category-btn.active::before {
            left: 0;
        }

        .category-btn:hover,
        .category-btn.active {
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            width: 90%;
            max-width: 500px;
            box-shadow: var(--hover-shadow);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }

            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            margin-bottom: auto;
            color: var(--text-primary);
        }

        .modal-content h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-content p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        #subscribe-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        #subscribe-form label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        #subscribe-form input,
        #subscribe-form select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        #subscribe-form select option {
        background-color: #000;   
        color: #fff;   }          
        #subscribe-form input:focus,
        #subscribe-form select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            background: var(--primary-gradient);
            border: none;
            padding: 1rem;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        /* Loading Styles */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* News Container */
        .news-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            min-height: 60vh;
        }

        /* Back to Top Button */
        .back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--secondary-gradient);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            z-index: 999;
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: translateY(-3px);
            box-shadow: var(--hover-shadow);
        }

        /* Footer */
        footer {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            margin-top: 4rem;
            padding: 2rem 0;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-content p {
            color: var(--text-muted);
        }

        .footer-links {
            display: flex;
            gap: 2rem;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--text-primary);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content h1 {
                font-size: 2rem;
            }

            .categories {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 1rem;
            }

            .category-btn {
                white-space: nowrap;
                flex-shrink: 0;
            }

            .news-container {
                grid-template-columns: 1fr;
                padding: 1rem;
            }

            .modal-content {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }

            .footer-links {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .header-container {
                padding: 0 1rem;
            }

            .header-content h1 {
                font-size: 1.5rem;
            }

            .header-content p {
                font-size: 1rem;
            }

            .subscribe-btn {
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }

            .categories-container {
                padding: 0 1rem;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-gradient);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-gradient);
        }

        /* Placeholder styles for news cards (you can customize these based on your script.js) */
        .news-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .news-card h3 {
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .news-card p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .news-card .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--glass-border);
        }

        .news-card .news-source {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .news-card .news-date {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-content">

                <h1>Daily AI News Digest</h1>
                <p>Stay ahead with the best and most viral AI headlines</p>
            </div>
            <button id="subscribe-btn" class="subscribe-btn">Subscribe</button>
        </div>  
    </header>

    <!-- News Categories Filter -->
    <div class="categories-container">
        <div class="categories">
            <button class="category-btn active" data-category="all">All News</button>
            <button class="category-btn" data-category="best">Best AI News</button>
            <button class="category-btn" data-category="viral">Most Viral</button>
            <button class="category-btn" data-category="relevant">Relevant News</button>
            <button class="category-btn" data-category="breaking">Breaking News</button>
            <button class="category-btn" data-category="research">AI Research</button>
        </div>
    </div>

    <!-- Subscribe Modal -->
    <div id="subscribe-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Subscribe to AI News</h2>
            <p>Get the latest AI news delivered to your inbox</p>
            <form id="subscribe-form" method="post">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="interests">AI Interests (Optional)</label>
                <select id="interests" name="interests">
                    <option value="">Select your interest</option>
                    <option value="machine-learning">Machine Learning</option>
                    <option value="robotics">Robotics</option>
                    <option value="nlp">Natural Language Processing</option>
                    <option value="computer-vision">Computer Vision</option>
                    <option value="general-ai">General AI News</option>
                </select>

                <button type="submit" class="submit-btn">Subscribe Now</button>
            </form>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading AI News...</p>
    </div>

    <!-- News Container -->
    <main id="news-container" class="news-container">
    </main>

    <!-- Back to Top Button -->
    <button id="back-to-top" class="back-to-top">↑</button>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 Daily AI News Digest. Powered by OpenAI + Gemini</p>
            <div class="footer-links">
                <a href="#privacy">Privacy Policy</a>
                <a href="terms.html">Terms of Service</a>
                <a href="contact.html">Contact Us</a>
            </div>
        </div>
    </footer>
    <script>
        // Basic functionality for the UI elements
        document.addEventListener('DOMContentLoaded', function () {
            const subscribeBtn = document.getElementById('subscribe-btn');
            const modal = document.getElementById('subscribe-modal');
            const closeBtn = document.querySelector('.close-btn');
            const categoryBtns = document.querySelectorAll('.category-btn');
            const backToTopBtn = document.getElementById('back-to-top');
            const loading = document.getElementById('loading');
            const newsContainer = document.getElementById('news-container');

            // Subscribe modal functionality
            subscribeBtn.addEventListener('click', () => {
                modal.style.display = 'block';
            });

            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            }); 

            window.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });

            // Category filter functionality
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    // Add your filtering logic here
                    const category = btn.dataset.category;
                    console.log('Selected category:', category);
                });
            });

            // Back to top functionality
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTopBtn.classList.add('visible');
                } else {
                    backToTopBtn.classList.remove('visible');
                }
            });

            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Form submission
            document.getElementById('subscribe-form').addEventListener('submit', function (e) {
                e.preventDefault();

                const formData = new FormData(this);
                const name = formData.get('name');
                const email = formData.get('email');
                const interests = formData.get('interests');

                // Add your form submission logic here
                console.log('Form submitted:', { name, email, interests });

                // Close modal after submission
                modal.style.display = 'none';

                // Show success message (you can customize this)
                alert('Thank you for subscribing! We\'ll keep you updated with the latest AI news.');
            });

            // Hide loading and show content (replace this with your actual news loading logic)
            setTimeout(() => {
                loading.style.display = 'none';
                newsContainer.style.display = 'grid';

                // Demo news cards (replace with your actual news data)
                const demoNews = [
                    {
                        title: "After India, OpenAI launches its affordable ChatGPT Go plan in Indonesia",
                        content: "OpenAI is expanding its budget-friendly ChatGPT subscription plan beyond India. The company launched its sub-$5 ChatGPT Go paid plan for the country’s users last month and now is rolling out the same plan in Indonesia for Rp75,000 ($4.50) per month.",
                        source: "AI Research Daily",
                        date: "Just now"
                    },
                    {
                        title: "Rocket.nXew, one of India’s first vibe-coding startups, snags $15M from Accel, Salesforce Ventures",
                        content: "Rocket.new, an Indian startup building an AI-powered app development platform, has raised $15 million in a seed round led by Salesforce Ventures to take on viral vibe-coding rivals like Lovable, Cursor, and Bolt by letting users build full, production-ready apps from natural-language prompts rather than just quick prototypes.",
                        source: "Tech News Today",
                        date: "Just now"
                    },
                    {
                        title: "Facebook is getting an AI dating assistant",
                        content: "This chatbot is intended to help users find matches who are more closely tailored to what they are looking for. For example, Meta might suggest users ask it to find “a Brooklyn girl in tech” or a user could ask the AI to help refine their profile.",
                        source: "Ethics in AI",
                        date: "Just now"
                    }
                ];

                // Create demo news cards
                demoNews.forEach(news => {
                    const card = document.createElement('div');
                    card.className = 'news-card';
                    card.innerHTML = `
            <h3>${news.title}</h3>
            <p>${news.content}</p>
            <div class="news-meta">
              <span class="news-source">${news.source}</span>
              <span class="news-date">${news.date}</span>
            </div>
          `;
                    newsContainer.appendChild(card);
                });
            }, 2000);
        });
    </script>
</body>
</html>
